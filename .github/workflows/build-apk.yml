name: Build ClawAim Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ClawAim4FTrainer-source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract ClawAim source
        run: |
          unzip -q -o ClawAim4FTrainer-source.zip
          ls -la ClawAim4FTrainer

      - name: Build debug APK
        working-directory: ClawAim4FTrainer
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawAim4FTrainer-debug-apk
          path: ClawAim4FTrainer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
