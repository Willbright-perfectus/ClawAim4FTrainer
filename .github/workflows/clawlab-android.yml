name: ClawLab Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClawLab/**'
      - '.github/workflows/clawlab-android.yml'
  pull_request:
    paths:
      - 'ClawLab/**'
      - '.github/workflows/clawlab-android.yml'

permissions:
  contents: read

concurrency:
  group: clawlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ClawLab
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build tools and graphical test display
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platform-tools"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Pinned Godot and export template
        run: python3 ci/setup_engine.py
      - name: Import project
        run: |
          mkdir -p build qa
          godot --headless --editor --path . --import --quit 2>&1 | tee qa/import.log
          python3 ci/check_log.py qa/import.log
      - name: Behavioral integration tests
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/clawlab-test-data
          CLAWLAB_TEST_REPORT: ${{ github.workspace }}/ClawLab/qa/test-results.json
        run: |
          godot --headless --path . --fixed-fps 120 res://tests/test_runner.tscn 2>&1 | tee qa/test.log
          python3 ci/check_log.py qa/test.log
      - name: Native menu and touch event tests
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/clawlab-ui-test-data
          CLAWLAB_UI_REPORT: ${{ github.workspace }}/ClawLab/qa/ui-results.json
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a godot --path . --audio-driver Dummy --fixed-fps 120 res://tests/ui_runner.tscn 2>&1 | tee qa/ui-tests.log
          python3 ci/check_log.py qa/ui-tests.log
      - name: Configure Android and preview certificate
        run: |
          python3 ci/configure_android.py
          keytool -genkeypair -keystore "$RUNNER_TEMP/clawlab-preview.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=ClawLab Preview,O=ClawLab,C=TZ' -noprompt
      - name: Export and verify APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/clawlab-preview.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          godot --headless --path . --export-release Android build/ClawLab-0.2.0-android-arm64.apk 2>&1 | tee qa/android-build.log
          python3 ci/check_log.py qa/android-build.log
          python3 ci/verify_apk.py build/ClawLab-0.2.0-android-arm64.apk
      - name: Upload Android preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClawLab-Android-preview
          path: |
            ClawLab/build/ClawLab-0.2.0-android-arm64.apk
            ClawLab/build/build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClawLab-validation
          path: |
            ClawLab/qa/*.log
            ClawLab/qa/*results.json
          retention-days: 30
